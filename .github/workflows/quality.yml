name: Node Quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.1
        env:
          CLUSTER_ID: Y2hhbG5hay1jaS10ZXN0MQ
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test commit policy
        run: python -m unittest discover -s scripts -p test_check_conventions.py
      - name: Check new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_conventions.py commit --base "$BASE" --head "$HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Kafka native binding on Linux
        run: node -e "require('@confluentinc/kafka-javascript')"
      - name: Generate owned Prisma clients
        run: |
          npm run prisma:auction-service:generate
          npm run prisma:notification-consumer-service:generate
      - run: npm run test:checks
      - run: npm run check:naming
      - run: npm run check:architecture
      - run: npm run check:format
      - run: npm run test:unit
      - name: Verify payment HTTP recovery and contention on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/auction_test
        run: npm run test:payment:integration
      - name: Verify bid recovery on real Kafka and PostgreSQL
        timeout-minutes: 6
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/auction_test
          TEST_KAFKA_BROKER: 127.0.0.1:9092
        run: npm run test:kafka:integration
      - run: npm run build:all
