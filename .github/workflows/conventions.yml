name: Conventions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test policy validator
        run: python -m unittest discover -s scripts -p test_check_conventions.py
      - name: Check new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_conventions.py commit --base "$BASE" --head "$HEAD"
